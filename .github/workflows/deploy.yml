name: Deploy para GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Build para GitHub Pages (domínio próprio serve da raiz)
        run: npm run build:gh-pages
        env:
          NODE_ENV: production
          # Site usa domínio próprio (www.projetovivacomsaude.com.br) servindo da raiz,
          # então a base PRECISA ser "/". O valor antigo com /nome-do-repo/ quebrava
          # os assets (/nome-do-repo/assets/...) e dava tela branca no domínio.
          BASE_URL: /
          # Cloudinary (fotos dos produtos). São valores públicos (preset unsigned),
          # então o upload funciona mesmo sem secret cadastrado — o código tem o
          # padrão. Cadastre os secrets abaixo só se trocar de conta/preset.
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}

      - name: Publicar na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
